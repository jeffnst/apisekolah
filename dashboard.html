<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard API Sekolah</title>
<style>:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--acc:#38bdf8;--ok:#4ade80;--bad:#f87171}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px}h1{font-size:20px;margin:0 0 12px}h2{font-size:14px;color:#38bdf8;margin:18px 0 8px}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{padding:8px 16px;border-radius:8px;background:#1e293b;cursor:pointer;user-select:none}.tab.active{background:#38bdf8;color:#0f172a;font-weight:700}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#1e293b;border-radius:10px;padding:14px}.card .v{font-size:22px;font-weight:700}.card .l{font-size:12px;opacity:.7}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #334155}th{color:#38bdf8;font-weight:600}.ok{color:#4ade80}.bad{color:#f87171}.bar{height:10px;background:#334155;border-radius:6px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:#4ade80;width:0%}button{padding:6px 12px;border:none;border-radius:6px;background:#38bdf8;color:#0f172a;cursor:pointer;font-weight:600;margin:2px}input,select{padding:6px 8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin:2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.logout{float:right;background:#f87171;color:#0f172a}pre{background:#0f172a;padding:10px;border-radius:8px;overflow:auto;font-size:12px;border:1px solid #334155}</style></head>
<body><div id="app"></div>
<script>
(function(){
  var ADMIN = localStorage.getItem('adminkey') || '';
  function api(path, opts){ opts=opts||{}; opts.headers=opts.headers||{}; if(ADMIN) opts.headers['X-Admin-Key']=ADMIN; return fetch(path,opts).then(function(r){return r.json().catch(function(){return {};});}); }
  function el(id){return document.getElementById(id);}
  function show(t){var tabs=document.querySelectorAll('.tab'),panels=document.querySelectorAll('.panel'),i;for(i=0;i<tabs.length;i++)tabs[i].classList.remove('active');for(i=0;i<panels.length;i++)panels[i].classList.remove('active');var tt=document.querySelector('.tab[data-tab="'+t+'"]');if(tt)tt.classList.add('active');var pp=el(t);if(pp)pp.classList.add('active');}
  function dashHtml(){return '<h1>Dashboard API Sekolah <button class="logout" id="lo">Logout</button></h1>'+
    '<div class="tabs"><div class="tab active" data-tab="mgmt">API Key</div><div class="tab" data-tab="users">User</div><div class="tab" data-tab="docs">API Docs</div><div class="tab" data-tab="log">Activity Log</div><div class="tab" data-tab="mon">Monitoring</div></div>'+
    '<div id="mgmt" class="panel active"><h2>API Keys</h2><div class="row"><input id="kname" placeholder="Nama aplikasi"><input id="kemail" placeholder="Email owner"><input id="krate" placeholder="Rate/min" style="width:120px"><button id="mk">+ Buat Key</button></div><div id="nk" class="card" style="display:none;margin:8px 0"></div><table id="kt"><tr><th>ID</th><th>Name</th><th>Key</th><th>Email</th><th>Rate/min</th><th>Total Req</th><th>Last Used</th><th>Active</th><th>Aksi</th></tr></table></div>'+
    '<div id="users" class="panel"><h2>User Management</h2><div class="row"><input id="uem" placeholder="email"><input id="upw" type="password" placeholder="password"><input id="unm" placeholder="nama"><select id="urole"><option value="user">user</option><option value="admin">admin</option></select><button id="mu">+ Buat User</button></div><table id="ut"><tr><th>ID</th><th>Email</th><th>Nama</th><th>Role</th><th>Active</th><th>Aksi</th></tr></table></div>'+
    '<div id="docs" class="panel"><h2>API Documentation</h2><div class="card"><b>BASE URL:</b> https://apisekolah.subuhkreatif.my.id/api/v1<br><b>Auth:</b> Header <code>X-API-Key: sk_xxx</code><br><b>Swagger UI:</b> <a href="/api-docs" style="color:#38bdf8">/api-docs</a> (bisa coba langsung)<br><br><b>GET /api/v1/sekolah</b> &mdash; list + filter sekolah<br><pre>GET /api/v1/sekolah?kode_kabupaten=32.71&amp;bentuk_pendidikan=SMA&amp;size=10\nAuthorization: X-API-Key sk_xxxx\n\n{ "success": true, "message": "Get Data Success", "total": 1383, "page":1, "size":10, "count":10, "data":[ { "sekolah_id":"...", "npsn":"...", "nama":"...", "bentuk_pendidikan":"SMA", "status_sekolah":"NEGERI", "akreditasi":"A", "alamat_jalan":"Jl. ...", "rt":"01", "rw":"02", "nama_dusun":"...", "kode_pos":"...", "kode_provinsi_kemendagri":"32", "nama_provinsi_kemendagri":"Jawa Barat", "kode_kabupaten_kemendagri":"32.71", "nama_kabupaten_kemendagri":"Kota Bogor", "kode_kecamatan_kemendagri":"327104", "nama_kecamatan_kemendagri":"Kota Bogor Barat", "kode_provinsi_dikdasmen":"3271", "nama_provinsi_dikdasmen":"Prov. Jawa Barat", "kode_kabupaten_dikdasmen":"3271", "nama_kabupaten_dikdasmen":"Kota Bogor", "lintang":"-6.5", "bujur":"106.7", "email":"sdncontoh@gmail.com", "telepon":"02155667788", "yayasan":"Yayasan Contoh", "web":"https://sdncontoh.sch.id" } ] }</pre><b>Filter yang tersedia:</b> npsn, nama (LIKE), q (cari nama/npsn), kode_provinsi, kode_kabupaten (32.71), kode_kecamatan (6 digit), nama_provinsi, nama_kabupaten, nama_kecamatan, bentuk_pendidikan, status_sekolah, akreditasi, page, size (max 100)<br><br><b>GET /api/v1/sekolah/:id</b> &mdash; detail lengkap (ruang, ptk, kurikulum, rasio, foto)<br><pre>GET /api/v1/sekolah/C7C3B2A6-34EC-4BA7-8EDE-B3EDB0B94F38\nAuthorization: X-API-Key sk_xxxx\n\n{ "success": true, "data": { "sekolah":{...}, "ruang":[...], "ptk":[...], "kurikulum":[...], "rasio":[...], "foto":[...] } }</pre><br><b>GET /api/v1/wilayah/provinsi</b> &mdash; list provinsi<br><b>GET /api/v1/wilayah/kabupaten?kode_provinsi=31</b> &mdash; list kabupaten<br><b>GET /api/v1/wilayah/kecamatan?kode_kabupaten=32.71</b> &mdash; list kecamatan<br><br>Semua endpoint di atas wajib header <code>X-API-Key</code>. Tanpa key &rarr; 401.</div></div>'+
    '<div id="log" class="panel"><h2>Activity Log</h2><table id="at"><tr><th>Waktu</th><th>User</th><th>Method</th><th>Path</th><th>IP</th><th>Status</th><th>ms</th></tr></table></div>'+
    '<div id="mon" class="panel"><div class="grid"><div class="card"><div class="v" id="up">-</div><div class="l">Uptime</div></div><div class="card"><div class="v" id="tt">-</div><div class="l">Total Req</div></div><div class="card"><div class="v" id="pct">-</div><div class="l">Progress</div></div></div><div class="bar"><i id="bar"></i></div><h2>Top Endpoint</h2><table id="ep"><tr><th>Endpoint</th><th>Count</th></tr></table><h2>Recent</h2><table id="rl"><tr><th>Waktu</th><th>Method</th><th>Path</th><th>IP</th><th>Status</th></tr></table></div>';}
  function loginHtml(){return '<div style="max-width:360px;margin:60px auto;background:#1e293b;padding:24px;border-radius:12px"><h1>Login</h1><input id="em" placeholder="email" style="width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0"><input id="pw" type="password" placeholder="password" style="width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0"><button id="lb" style="width:100%">Masuk</button><div id="err" class="bad"></div></div>';}
  function bind(){
    var tbs=document.querySelectorAll('.tab');for(var i=0;i<tbs.length;i++){(function(x){x.addEventListener('click',function(){show(x.getAttribute('data-tab'));});})(tbs[i]);}
    el('lo').addEventListener('click',function(){fetch('/logout',{method:'POST'}).then(function(){localStorage.removeItem('adminkey');location='/';});});
    el('mk').addEventListener('click',function(){api('/admin/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('kname').value,owner_email:el('kemail').value,rate_limit_per_min:el('krate').value||60})}).then(function(r){var n=el('nk');n.style.display='block';n.innerHTML='<b>Key baru:</b> <code>'+(r.api_key||'')+'</code> (simpan!)';loadKeys();});});
    el('mu').addEventListener('click',function(){api('/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('uem').value,password:el('upw').value,nama:el('unm').value,role:el('urole').value})}).then(function(){loadUsers();});});
    loadKeys();loadUsers();loadLog();mon();setInterval(mon,3000);
  }
  function loadKeys(){api('/admin/keys').then(function(rows){var h='<tr><th>ID</th><th>Name</th><th>Key</th><th>Email</th><th>Rate/min</th><th>Total Req</th><th>Last Used</th><th>Active</th><th>Aksi</th></tr>';rows.forEach(function(k){var full=k.api_key||'';h+='<tr><td>'+k.id+'</td><td>'+k.name+'</td><td><code style="font-size:11px">'+full+'</code></td><td>'+k.owner_email+'</td><td>'+k.rate_limit_per_min+'</td><td>'+k.total_requests+'</td><td>'+(k.last_used_at||'-')+'</td><td class="'+(k.is_active?'ok':'bad')+'">'+(k.is_active?'YA':'TIDAK')+'</td><td><button data-copy="'+full+'">Copy</button> <button data-t="'+k.id+'">'+(k.is_active?'Nonaktif':'Aktif')+'</button> <button data-d="'+k.id+'">Hapus</button></td></tr>';});el('kt').innerHTML=h;document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-copy');if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1500);});}else{var t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1500);}});});});document.querySelectorAll('[data-t]').forEach(function(b){b.addEventListener('click',function(){api('/admin/keys/'+b.getAttribute('data-t'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:b.textContent==='Aktif'?1:0})}).then(loadKeys);});});document.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){if(confirm('Hapus?'))api('/admin/keys/'+b.getAttribute('data-d'),{method:'DELETE'}).then(loadKeys);});});}function loadUsers(){api('/admin/users').then(function(rows){var h='<tr><th>ID</th><th>Email</th><th>Nama</th><th>Role</th><th>Active</th><th>Aksi</th></tr>';rows.forEach(function(u){h+='<tr><td>'+u.id+'</td><td>'+u.email+'</td><td>'+u.nama+'</td><td>'+u.role+'</td><td class="'+(u.is_active?'ok':'bad')+'">'+(u.is_active?'YA':'TIDAK')+'</td><td><button data-x="'+u.id+'">Nonaktif</button> <button data-y="'+u.id+'">Hapus</button></td></tr>';});el('ut').innerHTML=h;document.querySelectorAll('[data-x]').forEach(function(b){b.addEventListener('click',function(){api('/admin/users/'+b.getAttribute('data-x'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:0})}).then(loadUsers);});});document.querySelectorAll('[data-y]').forEach(function(b){b.addEventListener('click',function(){if(confirm('Hapus user?'))api('/admin/users/'+b.getAttribute('data-y'),{method:'DELETE'}).then(loadUsers);});});});}
  function loadLog(){api('/api/activity?limit=50').then(function(rows){var h='<tr><th>Waktu</th><th>User</th><th>Method</th><th>Path</th><th>IP</th><th>Status</th><th>ms</th></tr>';rows.forEach(function(r){h+='<tr><td>'+(r.created_at||'')+'</td><td>'+(r.email||'')+'</td><td>'+r.method+'</td><td>'+(r.path||'').slice(0,60)+'</td><td>'+r.ip+'</td><td class="'+(r.status<400?'ok':'bad')+'">'+r.status+'</td><td>'+r.ms+'</td></tr>';});el('at').innerHTML=h;});}
  function mon(){api('/api/stats').then(function(s){el('up').textContent=s.uptime_detik;el('tt').textContent=s.total_request;var ep='';for(var i=0;i<s.top_endpoint.length;i++)ep+='<tr><td>'+String(s.top_endpoint[i][0]).slice(0,50)+'</td><td>'+s.top_endpoint[i][1]+'</td></tr>';el('ep').innerHTML='<tr><th>Endpoint</th><th>Count</th></tr>'+ep;}).catch(function(){});api('/api/scrape-status').then(function(sc){el('pct').textContent=(sc.persen||0)+'%';el('bar').style.width=(sc.persen||0)+'%';});}
  function start(){
    fetch('/me').then(function(r){return r.json();}).then(function(j){
      if(j.user){ el('app').innerHTML=dashHtml(); bind(); }
      else { showLogin(); }
    }).catch(function(){ showLogin(); });
  }
  function showLogin(){
    el('app').innerHTML=loginHtml();
    var lb=el('lb'); if(lb) lb.addEventListener('click',function(){
      fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:el('em').value,password:el('pw').value})}).then(function(r){return r.json();}).then(function(j){
        if(j.ok){ if(j.user.role==='admin') localStorage.setItem('adminkey','x'); el('app').innerHTML=dashHtml(); bind(); }
        else { var e=el('err'); if(e) e.textContent=j.error; }
      });
    });
  }
  start();
})();
</script></body></html>
